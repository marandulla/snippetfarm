[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marandulla-snippetfarm"
version = "0.1.0"
description = "按用途管理提示词片段，支持按标签检索、组合与版本对照。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "marandulla" }]
keywords = ["snippet", "library", "prompt", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://marandulla.github.io"
Repository = "https://github.com/marandulla/snippetfarm"
Issues = "https://github.com/marandulla/snippetfarm/issues"

[project.scripts]
snippetfarm = "snippetfarm:main"

[tool.setuptools]
py-modules = ["snippetfarm"]
